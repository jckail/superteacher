# Depot CI is this repo's CI of record (JCK-2026). It replaces .github/workflows/ci.yml.
# Require only `depot-ci / ci-result`; it fails unless every job below succeeded.
name: depot-ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: depot-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Branch names its Linear issue (jck-<n>)
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "branch: $HEAD_REF"
          case "$HEAD_REF" in dependabot/*|renovate/*|release-please--*) exit 0 ;; esac
          echo "$HEAD_REF" | grep -Eiq '(^|[^a-z0-9])jck-[0-9]+' || { echo "::error::Branch '$HEAD_REF' has no Linear key; use the issue's gitBranchName (jck-<n>-topic)"; exit 1; }
  # Pinned gitleaks binary (gitleaks-action demands an org license on Depot CI).
  gitleaks:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (new commits; full history when there is no base)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          curl -fsSLo /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          if [ -n "$BASE" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            /tmp/gitleaks git --redact --no-banner --log-opts="${BASE}..HEAD" .
          else
            /tmp/gitleaks git --redact --no-banner .
          fi
  # Required verdict. Branch protection requires only `depot-ci / ci-result`.
  ci-result:
    name: ci-result
    if: always()
    needs: [branch-name, gitleaks, lint, api, web, browser, docker, e2e, bench-smoke]
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed (skipped branch-name on push is fine)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do case "$r" in success|skipped) ;; *) exit 1 ;; esac; done
  lint:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12', cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
  api:
    timeout-minutes: 10
    runs-on: depot-ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: st_test
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: st_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U st_test -d st_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ST_TEST_POSTGRES_URL: postgresql+psycopg://st_test:ci-only-test-password@localhost:5432/st_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12', cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      # The same pinned, checksum-verified Litestream the Docker image uses: lets the real restore/replicate
      # round-trip tests in tests/test_persistence_entrypoint.py run instead of skipping.
      - run: |
          mkdir -p "$HOME/.local/bin"
          python scripts/install_litestream.py 0.5.17 cfb371176d164437ae869f8351cfde49bd1804ae71c61923f75c9cba9c9c006d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: python -m pytest -v -o faulthandler_timeout=30
  web:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm run lint && npm test -- --maxWorkers=2 && npm run build
        working-directory: web
  browser:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12', cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: web/test-results/
          retention-days: 7
  docker:
    needs: [lint, api, web, browser, e2e]
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Reproduce private release archive directory permissions
        run: find superteacher alembic -type d -exec chmod 0700 {} +
      - uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
      - name: Build image (Depot)
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          project: w08dv8ptmw
          context: .
          load: true
          tags: superteacher:ci
      - name: Verify built runtime version, imports and non-root user
        run: |
          docker run --rm -i --entrypoint python superteacher:ci - <<'PY'
          import importlib
          import importlib.metadata
          import json
          import os
          import sqlite3
          import ssl
          import sys

          assert sys.version_info[:3] == (3, 12, 15), sys.version
          assert os.getuid() == 10001, os.getuid()
          for name in ("fastapi", "sqlalchemy", "psycopg", "anthropic", "uvicorn"):
              importlib.import_module(name)
          print(json.dumps({
              "python": sys.version,
              "uid": os.getuid(),
              "openssl": ssl.OPENSSL_VERSION,
              "sqlite": sqlite3.sqlite_version,
              "packages": sorted(
                  (distribution.metadata["Name"], distribution.version)
                  for distribution in importlib.metadata.distributions()
              ),
          }, sort_keys=True))
          PY
      - name: Check focused compatibility on the built Python runtime
        timeout-minutes: 5
        run: |
          docker run --rm -i --entrypoint sh \
            --mount "type=bind,source=$PWD/tests,target=/app/tests,readonly" \
            --workdir /app -e AUTH_DISABLED=true superteacher:ci -s <<'SH'
          set -eu
          runtime_test_dir=$(mktemp -d)
          trap 'rm -rf "$runtime_test_dir"' EXIT
          python -m pip freeze --all > "$runtime_test_dir/constraints.txt"
          python - "$runtime_test_dir/production.json" <<'PY'
          import importlib.metadata
          import json
          import sys

          with open(sys.argv[1], "w") as output:
              json.dump({d.metadata["Name"]: d.version for d in importlib.metadata.distributions()}, output)
          PY
          python -m venv --system-site-packages --without-pip "$runtime_test_dir/venv"
          "$runtime_test_dir/venv/bin/python" -m pip install \
            --constraint "$runtime_test_dir/constraints.txt" 'pytest>=8'
          "$runtime_test_dir/venv/bin/python" - "$runtime_test_dir/production.json" <<'PY'
          import importlib.metadata
          import json
          import os
          import sys

          assert sys.version_info[:3] == (3, 12, 15), sys.version
          assert os.getuid() == 10001, os.getuid()
          with open(sys.argv[1]) as source:
              expected = json.load(source)
          for name, version in expected.items():
              actual = importlib.metadata.version(name)
              assert actual == version, (name, version, actual)
          print(f"Verified {len(expected)} production package versions unchanged in test environment")
          PY
          "$runtime_test_dir/venv/bin/python" -m pytest -q -p no:cacheprovider \
            --basetemp "$runtime_test_dir/pytest" \
            tests/test_security_injection.py tests/test_accounts_tokens.py \
            tests/test_legacy_archive_viewer.py tests/test_legacy_archive_import.py \
            tests/test_export_streaming.py tests/test_account_export_streaming.py
          SH
      - name: Smoke test the image (auth on, health public, API gated)
        run: |
          docker run -d --name st -p 8080:8080 -e AUTH_PASSWORD=ci-secret -e SEED_DEMO_DATA=false superteacher:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/api/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/health)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/overview)" = 401
          curl -fsS localhost:8080/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/ready)" = 200
          curl -fsS -c /tmp/st-ci-cookies -H 'Content-Type: application/json' -H 'X-Requested-With: ci' \
            --data '{"password":"ci-secret"}' localhost:8080/api/auth/login
          test "$(curl -s -b /tmp/st-ci-cookies -o /dev/null -w '%{http_code}' localhost:8080/api/overview)" = 200
          test "$(curl -s -b /tmp/st-ci-cookies -o /dev/null -w '%{http_code}' localhost:8080/api/calendar)" = 200
          curl -fsS -b /tmp/st-ci-cookies -c /tmp/st-ci-cookies -H 'X-Requested-With: ci' -X POST localhost:8080/api/auth/logout
          test "$(curl -s -b /tmp/st-ci-cookies -o /dev/null -w '%{http_code}' localhost:8080/api/overview)" = 401
          rm -f /tmp/st-ci-cookies
          docker logs st
      - name: Refuses to start without a password
        run: |
          if docker run --rm superteacher:ci; then echo "container started without AUTH_PASSWORD"; exit 1; fi
  e2e:
    # Real browser tests (Playwright) + axe-core accessibility audit against the built app. See e2e/ and README.
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12', cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - run: npm ci
        working-directory: e2e
      - name: Resolve Playwright version
        id: pw
        working-directory: e2e
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: e2e
      - run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
        env: { CI: 'true' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
  bench-smoke:
    # Enforce every endpoint's latency, maximum SQL count and Python-memory budget.
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12', cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: python scripts/bench.py --sizes 1000 --runs 15 --fixed-runs --json bench-1k.json --markdown bench-1k.md
      - run: python scripts/check_bench_budgets.py bench-1k.json
      - run: if [ -f bench-1k.md ]; then cat bench-1k.md >> "$GITHUB_STEP_SUMMARY"; fi
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bench-1k
          if-no-files-found: error
          path: |
            bench-1k.json
            bench-1k.md
