[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["web", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "UP", "I", "SIM", "C4", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in argument defaults is the framework's idiom, not a mutable-default bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["superteacher"]
