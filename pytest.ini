[pytest]
testpaths = tests
# A new warning is a defect to fix (or explicitly filter here with a reason), not noise to scroll past.
filterwarnings =
    error
    # SQLAlchemy cannot reflect the functional UNIQUE(owner_id, lower(name)) index; tests/test_migrations.py asserts it directly.
    ignore:Skipped unsupported reflection of expression-based index:sqlalchemy.exc.SAWarning
    ignore:autogenerate skipping metadata-specified expression-based index:UserWarning
