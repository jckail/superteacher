name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm test && npm run build
        working-directory: web
  docker:
    needs: [lint, api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t superteacher:ci .
      - name: Smoke test the image (auth on, health public, API gated)
        run: |
          docker run -d --name st -p 8080:8080 -e AUTH_PASSWORD=ci-secret -e SEED_DEMO_DATA=false superteacher:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/api/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/overview)" = 401
          curl -fsS localhost:8080/ | grep -q '<div id="root">'
          docker logs st
      - name: Refuses to start without a password
        run: |
          if docker run --rm superteacher:ci; then echo "container started without AUTH_PASSWORD"; exit 1; fi
