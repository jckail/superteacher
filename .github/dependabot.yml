version: 2
updates:
  # No pip entry: Dependabot edits requirements.txt but cannot regenerate the hash-pinned
  # requirements.lock, so its bumps turned main red. .depot/workflows/lock-refresh.yml refreshes the
  # lock weekly as a Linear-keyed PR instead (JCK-2355).
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }
    groups:
      e2e-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
